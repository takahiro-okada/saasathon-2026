name: PR Title Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: write
  statuses: write

jobs:
  lint:
    name: Validate Conventional Commit format
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # No subject case enforcement — Dependabot uses "Bump ..." (capital B)
          # and humans can choose either style. The Conventional Commits spec
          # itself doesn't mandate subject case.
          wip: true
          validateSingleCommit: false
