name: Lighthouse CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Audit production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
          NEXT_PUBLIC_AI_ENABLED: "false"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start production server
        run: |
          pnpm start > /tmp/lighthouse-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lighthouse-server.log
          exit 1

      - name: Audit URL with Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Format Lighthouse score and comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const results = ${{ steps.lighthouse.outputs.manifest }};
            const links = ${{ steps.lighthouse.outputs.links }};
            const result = results[0].summary;
            const url = Object.keys(links)[0];
            const reportUrl = links[url];

            const score = (n) => {
              const s = Math.round(n * 100);
              const emoji = s >= 90 ? '🟢' : s >= 50 ? '🟡' : '🔴';
              return `${emoji} ${s}`;
            };

            const body = `## ⚡ Lighthouse Report

            Audited \`${url}\` on **mobile** (simulated 4G):

            | Category | Score |
            |---|---|
            | Performance | ${score(result.performance)} |
            | Accessibility | ${score(result.accessibility)} |
            | Best Practices | ${score(result['best-practices'])} |
            | SEO | ${score(result.seo)} |
            | PWA | ${result.pwa != null ? score(result.pwa) : 'N/A'} |

            📊 [Full report](${reportUrl})

            <sub>🤖 Auto-generated by Lighthouse CI</sub>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
