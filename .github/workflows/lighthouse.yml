name: Lighthouse CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Audit Vercel preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for Vercel preview deployment
        id: wait-preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          check_interval: 15

      - name: Audit URL with Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.wait-preview.outputs.url }}
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Format Lighthouse score and comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const results = ${{ steps.lighthouse.outputs.manifest }};
            const links = ${{ steps.lighthouse.outputs.links }};
            const result = results[0].summary;
            const url = Object.keys(links)[0];
            const reportUrl = links[url];

            const score = (n) => {
              const s = Math.round(n * 100);
              const emoji = s >= 90 ? '🟢' : s >= 50 ? '🟡' : '🔴';
              return `${emoji} ${s}`;
            };

            const body = `## ⚡ Lighthouse Report

            Audited \`${url}\` on **mobile** (simulated 4G):

            | Category | Score |
            |---|---|
            | Performance | ${score(result.performance)} |
            | Accessibility | ${score(result.accessibility)} |
            | Best Practices | ${score(result['best-practices'])} |
            | SEO | ${score(result.seo)} |
            | PWA | ${result.pwa != null ? score(result.pwa) : 'N/A'} |

            📊 [Full report](${reportUrl})

            <sub>🤖 Auto-generated by Lighthouse CI</sub>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
